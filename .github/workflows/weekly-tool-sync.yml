name: Weekly tool sync

on:
  schedule:
    # Mondays 06:44 America/Los_Angeles (13:44 UTC) — 2h after the 04:44 Gmail intake
    - cron: "44 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print without writing"
        default: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Sync approved sheet rows into Supabase
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_SYNC_KEY: ${{ secrets.SHEET_SYNC_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://aigentsmith.app
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == '1' && '1' || '' }}
        run: node automation/sync-sheet-to-supabase.mjs
